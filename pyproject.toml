[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-bench"
version = "0.2.0"
description = "Open benchmark for epistemic virtues of frontier LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
google = ["google-generativeai>=0.8"]
# The suite is stdlib unittest; pytest runs it too if you prefer `pytest tests/`.
# jsonschema enables the full JSON-Schema validation pass in tests/test_schema_sync.py.
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
epb = "epistemic_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
